name: Deploy JAI Backend

on: 
  push: 
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps: 

      - name: Checkout Repository 
        uses: actions/checkout@v4

      - name: Set up Python 
        uses: actions/setup-python@v5
        with:  
          python-version: "3.11"

      - name: Install Dependencies 
        run: |
          pip install -r requirements.txt 
      
      - name: Run Tests 
        run: |
          pytest || true 

      - name: Configure AWS Credentials 
        uses: aws-actions/configure-aws-credential@v4
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR 
        id: login-ecr 
        uses: aws-actions/amazon-ecr-login@v2 

      - name: Build Docker Image
        run: |
          docker build -t jai-backend . 

      - name: Tag Docker Image 
        run: |
          docker tag jai-backend:latest \
          ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Push Image 
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}

      - name: Force ECS Deployment 
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }}
            --service ${{ secrets.ECS_SERVICE }}
            --force-new-deployment